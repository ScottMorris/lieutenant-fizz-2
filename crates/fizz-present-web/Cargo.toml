[package]
name = "fizz-present-web"
description = "Web presenter for Lieutenant Fizz 2: a wasm-bindgen app that paces the rules from browser time"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fizz-sim = { path = "../fizz-sim" }
fizz-ep2 = { path = "../fizz-ep2" }
fizz-slice-view = { path = "../fizz-slice-view" }
fizz-sfx = { path = "../fizz-sfx" }
fizz-hal = { path = "../fizz-hal" }
fizz-machine = { path = "../fizz-machine" }
fizz-menu = { path = "../fizz-menu" }
wasm-bindgen = "=0.2.125"
