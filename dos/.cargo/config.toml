# Rust has no precompiled core or alloc for a DOS target, so build them from rust-src. These options are unstable; tools/build-dos.sh
# sets RUSTC_BOOTSTRAP=1 so the pinned stable toolchain accepts them. compiler-builtins-mem supplies memcpy, memmove, memset and
# memcmp, which nothing else provides when there is no C library.
#
# Adapted from fizz-2-dos-poc1 apps/demo-dos/.cargo/config.toml (itself from Desk spikes/d0-rust-dos/.cargo/config.toml); the
# paths now sit one level up because the workspace root is dos/.
[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[build]
target = "dos-elf.json"

# rust-lld links the ELF with our script; tools/elf2go32.py then packs the ELF into the go32 image. Run cargo from dos/: the linker
# script path is relative to the working directory.
[target.dos-elf]
rustflags = ["-C", "link-arg=-Tlink.ld", "-C", "link-arg=-nostdlib", "-C", "link-arg=-static", "-C", "relocation-model=static"]
