# DOSBox settings for the copy of FIZZ2.EXE that runs in the browser (js-dos) in the local preview. They are Fizz 1 DOS's
# (site/dosbox.web.conf in lieutenant-fizz-dos) except the sound card: Fizz 2's OPL3 pair needs an SB16. The page fills in @COMMAND@.
[sdl]
fullscreen = false
autolock = false

[cpu]
core = auto
cputype = auto
cycles = max

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
oplmode = auto
# compat, the lightest, played Fizz 1's music wrongly in the browser; fast and default (Nuked) both play it right.
oplemu = fast

[mixer]
rate = 44100
blocksize = 1024
# js-dos 8's mixer hands audio to the page in 512-sample pushes and speeds itself up by three times the prebuffer to fill it:
# at 40 ms it makes about 12% more samples than the rate says, the page's time-stretcher (5% at most) cannot keep up, and its
# ring drops samples all the time. At 0 the stream runs at its real rate (Fizz 1 measured its test tone at 440 Hz, not 393).
prebuffer = 0

[autoexec]
@echo off
mount c .
c:
@COMMAND@
