<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lieutenant Fizz 2 DOS (js-dos)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='5' y='2' width='6' height='1' fill='%23aaa'/%3E%3Crect x='5' y='3' width='6' height='11' fill='%23f5f'/%3E%3Crect x='5' y='6' width='6' height='3' fill='%23fff'/%3E%3Crect x='5' y='3' width='1' height='11' fill='%23a0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="js-dos/js-dos.css">
<link rel="stylesheet" href="../fizz.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="../">&larr; Preview home</a>
  <nav id="modes" aria-label="DOS modes"></nav>
  <span class="actions">
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <button id="full" type="button">Fullscreen</button>
    <button id="restart" type="button" disabled>Restart</button>
  </span>
</header>
<div id="stage">
  <div id="dos"></div>
  <div id="cover">
    <div class="title-card panel">
      <img class="hero" src="../hero.svg" width="160" height="48" alt="">
      <h1 class="logo">Lieutenant Fizz 2</h1>
      <p class="tagline">DOS build in js-dos</p>
      <p id="blurb">A click starts the game and the sound. Click the screen after it loads so the keys reach it.</p>
      <button id="play" type="button">Play</button>
    </div>
  </div>
</div>
<script src="js-dos/js-dos.js"></script>
<script src="player.js"></script>
</body>
</html>
